schema: mega-review/1
package: mu2edaq-runlog-db
tier: A
group: operations
repo:
  url: git@github.com:Mu2e/mu2edaq-runlog-db.git
  exists: true
  issues_enabled: true
doc_dir: docs
summary: >
  Django web viewer and manual-entry tool for the Mu2e DAQ run-log database
  (runs, subruns, EWT lookup) on SQLite or the production PostgreSQL written by
  the otsdaq DBRunInfo plugin, served on port 8000
languages: [python, html, bash]
loc: 2718

runtime:
  executables:
    - name: runlogdb.wsgi (gunicorn / manage.py runserver)
      kind: daemon
      man_page: man/man7/mu2edaq-runlog-db.7
    - name: start-mu2edaq-runlog-db.sh
      kind: script
      man_page: man/man1/start-mu2edaq-runlog-db.sh.1
    - name: stop-mu2edaq-runlog-db.sh
      kind: script
      man_page: man/man1/stop-mu2edaq-runlog-db.sh.1
    - name: start-mu2e-rundb-viewer
      kind: script
      man_page: man/man1/start-mu2e-rundb-viewer.1
    - name: stop-mu2e-rundb-viewer
      kind: script
      man_page: man/man1/stop-mu2e-rundb-viewer.1
    - name: bootstrap-mu2e-rundb-viewer
      kind: script
      man_page: man/man1/bootstrap-mu2e-rundb-viewer.1
    - name: manage.py
      kind: cli
      man_page: man/man1/manage.py.1
  services: []
  ports:
    - {port: 8000, proto: tcp, role: web-ui, source: "start-mu2e-rundb-viewer:43"}
    - {port: 8000, proto: tcp, role: web-ui-docker, source: "Dockerfile:27"}
    - {port: 28999, proto: udp, role: discovery-responder, source: "runs/apps.py:27"}
    - {port: 5432, proto: tcp, role: postgres-client, source: "config/default.yaml:7"}
  config_files: [config/default.yaml, config/development.yaml, config/production.yaml, .env]
  env_vars:
    - DJANGO_ENV
    - DJANGO_SETTINGS_MODULE
    - CRS_PORT_HTTP
    - RUNLOGDB_HOST
    - RUNLOGDB_PORT
    - RUNLOGDB_SECRET_KEY
    - RUNLOGDB_DEBUG
    - RUNLOGDB_DB_BACKEND
    - RUNLOGDB_DB_HOST
    - RUNLOGDB_DB_PORT
    - RUNLOGDB_DB_NAME
    - RUNLOGDB_DB_USER
    - RUNLOGDB_DB_PASSWORD
    - RUNLOGDB_AUTH_ENABLED
    - RUNLOGDB_FERMILAB_CLIENT_ID
    - RUNLOGDB_FERMILAB_CLIENT_SECRET
    - RUNLOGDB_GOOGLE_CLIENT_ID
    - RUNLOGDB_GOOGLE_CLIENT_SECRET
    - RUNLOGDB_GITHUB_TOKEN
    - RUNLOGDB_GITHUB_REPO

interactions:
  depends_on:
    - package: mu2edaq-discovery
      via: import
      direction: out
      evidence: "runs/apps.py:24"
    - package: otsdaq-mu2e
      via: postgres-read
      direction: out
      evidence: "runs/models.py:54"
  depended_on_by: []
  external: [postgresql, github-api, google-oauth, fermilab-keycloak-oidc, pypi, cdn.tailwindcss.com]

quality:
  tests: {present: false, framework: none, count: 0}
  ci: {present: false, workflows: []}
  license: MIT
  artifacts_clean: true

