notes:
  auth_verdict: >
    Open to anyone who reaches :8000. Production overlay: every /runs/ view
    except /runs/about/ is @login_required, but django-allauth local signup is
    left open (no ACCOUNT_ADAPTER; templates hide the form, the endpoint still
    accepts a POST) and grants full read and write access; verified end-to-end
    with CSRF enforcement and a self-chosen token (RL-001). Any Google account
    is admitted. ALLOWED_HOSTS is bypassed by sending Host: localhost.
    Development overlay, which is what every scripted and control-room launch
    gets because start-mu2e-rundb-viewer:39 pre-exports DJANGO_ENV=development
    and .env cannot override it (RL-002): no authentication, every request is
    superuser "dev", DEBUG on, ALLOWED_HOSTS "*", bound to 127.0.0.1 by
    default.
  secret_key: >
    RUNLOGDB_SECRET_KEY, else the committed "change-me-before-deploying"
    (config/default.yaml:29), inherited by production with no check. Sessions
    are database-backed, so the known key does not mint a login (RL-006).
  debug_allowed_hosts: >
    Production DEBUG false; ALLOWED_HOSTS [localhost, 127.0.0.1] inherited,
    no env override. Development DEBUG true, ALLOWED_HOSTS ["*"].
  db_router: >
    ProductionRouter only implements allow_migrate (False for app runs on
    PostgreSQL). No db_for_read/db_for_write; it does not make anything
    read-only. The app writes run, run_end_info and subrun through its entry
    forms, and seed_db/purge_db write and delete all nine tables (RL-003,
    RL-005). Django's own tables are migrated into the run-log DB (RL-007).
  sql_construction: >
    None in this package: ORM only, no raw(), extra() or cursor use. The
    writer, otsdaq-mu2e DBRunInfo, builds SQL by string concatenation with a
    sanitised comment; outside this package and Tier B, not reviewed.
  data_source: >
    otsdaq-mu2e RunInfoPlugins/DBRunInfo (DEFINE_OTS_PROCESSOR at
    DBRunInfo_runInfo.cc:1346) inserts run (:902-910, number from the
    sequence via RETURNING run_number), run_transition (:1077), run_end_info
    (:1115) and config (:491), schema-qualified by
    OTSDAQ_RUNINFO_DATABASE_SCHEMA (default test) in database
    OTSDAQ_RUNINFO_DATABASE (default run_info) (:20-37). DBRunInfo does not
    write subrun; that writer is not identified in mu2edaq-main.
  entry_points: >
    git ls-files -s shows no mode-120000 entries. start-/stop-mu2edaq-runlog-db.sh
    are 2-line control-room wrappers that exec start-/stop-mu2e-rundb-viewer
    (mapping CRS_PORT_HTTP to RUNLOGDB_PORT); not duplicates.
  via_extension: >
    The otsdaq-mu2e dependency is a shared PostgreSQL database; the contract's
    via list has sqlite-read but no PostgreSQL entry, so postgres-read is used.
    Evidence is the model bound to the table DBRunInfo writes.
  discovery_meta: >
    Responder is constructed without meta (runs/apps.py:27-29), so the
    CONTRACT 9.5 string-only rule holds.
  venv: >
    .venv/ exists on disk, is git-ignored and untracked; not a finding. It was
    used read-only as the interpreter for the scratch-copy verification.
  loc: >
    2718 = Python 1481 (incl. 241-line migration) + templates 971 + shell 186
    + config YAML 50 + Dockerfile 30. Excludes Markdown, the schema dumps and
    PNGs.
  man_layout: >
    New pages in man/manN/; no git mv; no stale path references.
